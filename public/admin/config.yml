backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main
  # Backend local (decap-server): guarda los cambios directamente en tu repositorio
  # git local haciendo commits. No requiere Netlify ni credenciales externas.
  # Para publicar desde el navegador directo a GitHub necesitarías Netlify Identity / Git Gateway.

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "config"
    label: "Configuración Global"
    folder: "src/content/config"
    create: false
    format: "yaml"
    extension: "yaml"
    identifier_field: "siteName"
    fields:
      - { label: "Nombre del sitio", name: "siteName", widget: "string" }
      - { label: "Subtítulo del sitio", name: "siteSubtitle", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image" }
      - { label: "Descripción", name: "description", widget: "text" }
      - label: "Contacto"
        name: "contact"
        widget: "object"
        fields:
          - { label: "Dirección", name: "address", widget: "string" }
          - { label: "Teléfono", name: "phone", widget: "string" }
          - { label: "Correo", name: "email", widget: "string" }
      - label: "Redes Sociales"
        name: "social"
        widget: "object"
        fields:
          - { label: "Facebook", name: "facebook", widget: "string", required: false }
          - { label: "Twitter / X", name: "twitter", widget: "string", required: false }
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
      - label: "Navegación"
        name: "navigation"
        widget: "list"
        fields:
          - { label: "Etiqueta", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - label: "Submenú"
            name: "children"
            widget: "list"
            required: false
            fields:
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      - label: "Pie de página"
        name: "footer"
        widget: "object"
        fields:
          - { label: "Descripción", name: "description", widget: "text" }
          - { label: "Título enlaces rápidos", name: "quickLinksTitle", widget: "string" }
      - label: "Aviso de cookies"
        name: "cookies"
        widget: "object"
        hint: "Activa o desactiva el banner de cookies que aparece al abrir el sitio"
        fields:
          - { label: "Mostrar banner de cookies", name: "enabled", widget: "boolean", default: true }
          - { label: "Mensaje del banner", name: "message", widget: "text", required: false }
          - { label: "Texto botón aceptar", name: "acceptLabel", widget: "string", required: false }
          - { label: "Texto botón rechazar", name: "declineLabel", widget: "string", required: false }

  - name: "noticias"
    label: "Noticias / Blog"
    folder: "src/content/noticias"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Resumen", name: "description", widget: "text" }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Categoría", name: "category", widget: "string", default: "Noticias" }
      - { label: "Foto de portada", name: "heroImage", widget: "image", required: false }
      - { label: "Icono (clase Font Awesome)", name: "icon", widget: "string", default: "fas fa-newspaper" }
      - { label: "Contenido", name: "body", widget: "markdown" }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }

  - name: "eventos"
    label: "Eventos"
    folder: "src/content/eventos"
    create: true
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Día", name: "day", widget: "string" }
      - { label: "Mes", name: "month", widget: "string" }
      - { label: "Ubicación", name: "location", widget: "string" }
      - { label: "Hora", name: "time", widget: "string" }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }

  - name: "programas"
    label: "Programas Académicos"
    folder: "src/content/programas"
    create: true
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Icono (clase Font Awesome)", name: "icon", widget: "string" }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options: ["grado", "posgrado", "doctorado"]
      - { label: "Duración", name: "duration", widget: "string", required: false }
      - { label: "Modalidad", name: "modality", widget: "string", required: false }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }
      - { label: "Orden", name: "order", widget: "number", required: false }

  - name: "equipo"
    label: "Equipo / Autoridades"
    folder: "src/content/equipo"
    create: true
    identifier_field: "name"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Cargo", name: "position", widget: "string" }
      - { label: "Biografía", name: "bio", widget: "text", required: false }
      - { label: "Foto", name: "photo", widget: "image", required: false }
      - { label: "Icono (clase Font Awesome)", name: "icon", widget: "string", required: false }
      - { label: "Orden", name: "order", widget: "number", required: false }

  - name: "testimonios"
    label: "Testimonios"
    folder: "src/content/testimonios"
    create: true
    identifier_field: "author"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Rol", name: "role", widget: "string" }
      - { label: "Cita", name: "quote", widget: "text" }
      - { label: "Calificación (1-5)", name: "rating", widget: "number", default: 5 }

  - name: "proyectos"
    label: "Proyectos Activos"
    folder: "src/content/proyectos"
    create: true
    format: "yaml"
    fields:
      - { label: "Área", name: "area", widget: "string" }
      - { label: "Icono (clase Font Awesome)", name: "icon", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Coordinador/a", name: "coordinador", widget: "string", required: false }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Orden", name: "order", widget: "number", required: false }

  - name: "estadisticas"
    label: "Estadísticas"
    folder: "src/content/estadisticas"
    create: true
    identifier_field: "label"
    format: "yaml"
    extension: "yaml"
    fields:
      - { label: "Valor", name: "value", widget: "number" }
      - { label: "Sufijo", name: "suffix", widget: "string", default: "+" }
      - { label: "Etiqueta", name: "label", widget: "string" }
      - { label: "Orden", name: "order", widget: "number", required: false }

  - name: "grupos"
