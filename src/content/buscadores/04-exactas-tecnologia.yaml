title: "Ciencias Exactas, Tecnología e Ingeniería"
icon: "fas fa-atom"
desc: "Repositorios y bases de datos para la investigación en ciencia, tecnología e ingeniería."
order: 4
items:
  - name: "arXiv"
    desc: "Repositorio de preprints de física, matemáticas, informática y otras ciencias exactas."
    url: "https://arxiv.org"
    logo: "/images/buscadores/arxiv.svg"
    access: "abierto"
    tip: "Consulta la versión más reciente del preprint antes de citarlo."
  - name: "IEEE Xplore"
    desc: "Base de datos de referencia en ingeniería, electrónica e informática."
    url: "https://ieeexplore.ieee.org"
    logo: "/images/buscadores/ieee.svg"
    access: "mixto"
    tip: "Filtra por «Early Access» para consultar los artículos más recientes."
  - name: "ACM Digital Library"
    desc: "Biblioteca de la Association for Computing Machinery especializada en computación."
    url: "https://dl.acm.org"
    logo: "/images/buscadores/acm.svg"
    access: "mixto"
    tip: "Explora los grupos de interés (SIG) para seguir la comunidad de tu área."
  - name: "ScienceDirect"
    desc: "Plataforma de Elsevier con artículos de ciencia, técnica y medicina."
    url: "https://www.sciencedirect.com"
    logo: "/images/buscadores/elsevier.svg"
    access: "institucional"
    tip: "Usa el resaltado de términos para localizar rápido lo esencial de cada artículo."
  - name: "SpringerLink"
    desc: "Libros, capítulos y revistas de Springer Nature en todas las áreas científicas."
    url: "https://link.springer.com"
    logo: "/images/buscadores/springer.svg"
    access: "mixto"
    tip: "Los capítulos de libros suelen ofrecer una visión más amplia que un artículo."
