title: "Acceso Abierto y Repositorios"
icon: "fas fa-lock-open"
desc: "Fuentes de consulta gratuita y repositorios de ciencia abierta, ideales para leer y difundir investigación sin barreras."
order: 2
items:
  - name: "SciELO"
    desc: "Biblioteca científica regional de revistas de América Latina, el Caribe, España y Portugal."
    url: "https://www.scielo.org"
    logo: "/images/buscadores/scielo.svg"
    access: "abierto"
    tip: "Filtra por país o colección temática para encontrar la producción científica regional."
  - name: "Redalyc"
    desc: "Red de revistas científicas de acceso abierto de Iberoamérica y el Caribe."
    url: "https://www.redalyc.org"
    logo: "/images/buscadores/redalyc.svg"
    access: "abierto"
    tip: "Revisa los indicadores de cada revista antes de publicar o citar un trabajo."
  - name: "DOAJ"
    desc: "Directorio internacional de revistas científicas de acceso abierto con revisión por pares."
    url: "https://doaj.org"
    logo: "/images/buscadores/doaj.svg"
    access: "abierto"
    tip: "Comprueba que una revista esté indexada aquí para evitar publicaciones depredadoras."
  - name: "Dialnet"
    desc: "Portal hispano de difusión científica: artículos, tesis y libros en español."
    url: "https://dialnet.unirioja.es"
    logo: "/images/buscadores/dialnet.png"
    access: "abierto"
    tip: "Activa alertas por autor o materia para seguir temas de tu interés."
  - name: "Zenodo"
    desc: "Repositorio abierto del CERN para depositar y citar datos, software y publicaciones."
    url: "https://zenodo.org"
    logo: "/images/buscadores/zenodo.svg"
    access: "abierto"
    tip: "Cada depósito recibe un DOI propio para poder citarlo de forma permanente."
