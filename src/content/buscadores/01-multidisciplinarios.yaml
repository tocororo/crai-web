title: "Multidisciplinarios"
icon: "fas fa-globe"
desc: "Buscadores que cubren todas las áreas del conocimiento y permiten localizar literatura científica de forma transversal."
order: 1
items:
  - name: "Google Scholar"
    desc: "Buscador académico de Google que indexa artículos, tesis, libros y citas de todo el mundo."
    url: "https://scholar.google.com"
    logo: "/images/buscadores/googlescholar.svg"
    access: "abierto"
    tip: "Usa comillas para frases exactas y el enlace «Citado por» para encontrar trabajos más recientes."
  - name: "Semantic Scholar"
    desc: "Motor con inteligencia artificial que resume y relaciona más de 200 millones de artículos científicos."
    url: "https://www.semanticscholar.org"
    logo: "/images/buscadores/semanticscholar.svg"
    access: "abierto"
    tip: "Explora el contexto de citas para ver cómo otros trabajos han utilizado un mismo artículo."
  - name: "Scopus"
    desc: "La mayor base de datos de resúmenes y citas con revisión por pares, útil para medir el impacto."
    url: "https://www.scopus.com"
    logo: "/images/buscadores/scopus.svg"
    access: "institucional"
    tip: "Ordena por «Cited by» para detectar los trabajos más influyentes de un tema."
  - name: "Web of Science"
    desc: "Base de datos multidisciplinar de Clarivate para el análisis de citas e impacto científico."
    url: "https://www.webofscience.com"
    logo: "/images/buscadores/wos.svg"
    access: "institucional"
    tip: "Utiliza la búsqueda de referencias citadas para rastrear la evolución de una idea."
  - name: "CORE"
    desc: "Agregador de millones de artículos de acceso abierto procedentes de repositorios de todo el mundo."
    url: "https://core.ac.uk"
    logo: "/images/buscadores/core.png"
    access: "abierto"
    tip: "Permite descargar el texto completo y guardar las búsquedas para reutilizarlas."
  - name: "OpenAIRE"
    desc: "Infraestructura europea que conecta publicaciones, datos y proyectos de investigación financiados."
    url: "https://www.openaire.eu"
    logo: "/images/buscadores/openaire.svg"
    access: "abierto"
    tip: "Filtra por proyecto financiado para localizar los resultados de investigaciones concretas."
  - name: "Dimensions"
    desc: "Base de datos que enlaza publicaciones, citas, patentes y subvenciones en una misma plataforma."
    url: "https://www.dimensions.ai"
    logo: "/images/buscadores/dimensions.png"
    access: "mixto"
    tip: "La versión gratuita permite explorar resúmenes y métricas de citación de forma abierta."
