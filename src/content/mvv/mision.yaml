title: "Misión"
desc: "Contribuir en la transformación de la calidad y la pertinencia de los procesos sustantivos de la universidad, mediante el empleo intensivo de la información científico y tecnológica, servicios para el desempeño de actividades docentes de aprendizaje y de investigación, y como copartícipe en la formación continua de los egresados, tributando al fortalecimiento de la labor político ideológica con los profesores y estudiantes en la comunidad universitaria y su entorno social."
order: 1
