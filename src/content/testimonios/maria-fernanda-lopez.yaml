author: "María Fernanda López"
role: "Egresada de Psicología, Promoción 2025"
quote: "El CRAI me ha brindado mucho más que una educación de calidad. Las actividades culturales, los deportes y el ambiente inclusivo del campus hicieron de mis años de estudio una experiencia inolvidable. Los servicios de orientación y el comedor universitario fueron un apoyo fundamental en mi día a día."
