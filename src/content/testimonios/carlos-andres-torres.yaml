author: "Carlos Andrés Torres"
role: "Estudiante de Ingeniería Informática, 4° año"
quote: "Llegué como estudiante de intercambio y me quedé maravillado por la calidez de la comunidad. Participar en el voluntariado ambiental y en el club de teatro me permitió hacer amigos de todas las facultades. Las instalaciones deportivas son de primer nivel y el programa de tutorías me ayudó a adaptarme rápidamente."
